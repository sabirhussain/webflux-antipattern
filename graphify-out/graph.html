        :root {
            --bg: #0f0f1a;
            --panel: #1a1a2e;
            --border: #2a2a4e;
            --input-border: #3a3a5e;
            --text: #e0e0e0;
            --text-2: #aaa;
            --text-3: #ccc;
            --muted: #555;
            --count: #666;
            --neighbor-border: #333;
            --node-label: #ffffff;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --panel: #f8f9fa;
            --border: #d9dee5;
            --input-border: #c3cad4;
            --text: #222222;
            --text-2: #666666;
            --text-3: #333333;
            --muted: #888888;
            --count: #777777;
            --neighbor-border: #ccc;
            --node-label: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #graph {
            flex: 1;
        }

        #sidebar {
            width: 280px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #search-wrap {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        #search {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        #search:focus {
            border-color: #4E79A7;
        }

        #search-results {
            max-height: 140px;
            overflow-y: auto;
            padding: 4px 12px;
            border-bottom: 1px solid var(--border);
            display: none;
        }

        .search-item {
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-item:hover {
            background: var(--border);
        }

        #info-panel {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            min-height: 140px;
        }

        #info-panel h3 {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #info-content {
            font-size: 13px;
            color: var(--text-3);
            line-height: 1.6;
        }

        #info-content .field {
            margin-bottom: 5px;
        }

        #info-content .field b {
            color: var(--text);
        }

        #info-content .empty {
            color: var(--muted);
            font-style: italic;
        }

        .neighbor-link {
            display: block;
            padding: 2px 6px;
            margin: 2px 0;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid var(--neighbor-border);
        }

        .neighbor-link:hover {
            background: var(--border);
        }

        #neighbors-list {
            max-height: 160px;
            overflow-y: auto;
            margin-top: 4px;
        }

        #legend-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        #legend-wrap h3 {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .legend-item:hover {
            background: var(--border);
            padding-left: 4px;
        }

        .legend-item.dimmed {
            opacity: 0.35;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .legend-count {
            color: var(--count);
            font-size: 11px;
        }

        #stats {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--muted);
        }

        #legend-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 4px 0;
        }

        #legend-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-2);
            user-select: none;
        }

        #legend-controls label:hover {
            color: var(--text);
        }

        .legend-cb, #select-all-cb {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 1.5px solid var(--input-border);
            border-radius: 3px;
            background: var(--bg);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .legend-cb:checked, #select-all-cb:checked {
            background: #4E79A7;
            border-color: #4E79A7;
        }

        .legend-cb:checked::after, #select-all-cb:checked::after {
            content: '';
            position: absolute;
            left: 3.5px;
            top: 1px;
            width: 4px;
            height: 7px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        #select-all-cb:indeterminate {
            background: #4E79A7;
            border-color: #4E79A7;
        }

        #select-all-cb:indeterminate::after {
            content: '';
            position: absolute;
            left: 2px;
            top: 5px;
            width: 8px;
            height: 2px;
            background: #fff;
            border: none;
            transform: none;
        }

        #theme-wrap {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        #theme-wrap button {
            flex: 1;
            background: var(--bg);
            color: var(--text-2);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 3px 0;
            font-size: 11px;
            cursor: pointer;
        }

        #theme-wrap button:hover {
            color: var(--text);
        }

        #theme-wrap button[aria-pressed="true"] {
            background: #4E79A7;
            border-color: #4E79A7;
            color: #fff;
        }
    </style>
    <script id="graphify-theme-init">
        // Apply the saved theme before first paint (#3894). No saved choice keeps the
        // historical dark look; "system" follows prefers-color-scheme.
        (function () {
            var pref = null;
            try {
                pref = localStorage.getItem('graphify-theme');
            } catch (e) {
            }
            var t = pref === 'light' ? 'light'
                : pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light'
                    : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>

        "label": "Integration &amp; Filter Tests",
        "count": 39
    }, {"cid": 4, "color": "#59A14F", "label": "REST Resources &amp; DTOs", "count": 34}, {
        "cid": 5,
        "color": "#EDC948",
        "label": "Tenant Context Holder",
        "count": 33
    }, {"cid": 6, "color": "#B07AA1", "label": "README Antipattern Concepts", "count": 30}, {
        "cid": 7,
        "color": "#FF9DA7",
        "label": "Profile Annotations &amp; Tenant Services",
        "count": 27
    }, {"cid": 8, "color": "#9C755F", "label": "JPA Entities &amp; Repositories", "count": 19}, {
        "cid": 9,
        "color": "#BAB0AC",
        "label": "Scheduler &amp; OpenAPI Config",
        "count": 17
    }, {"cid": 10, "color": "#4E79A7", "label": "Application YAML Config", "count": 12}, {
        "cid": 11,
        "color": "#F28E2B",
        "label": "Maven Wrapper Script",
        "count": 10
    }, {"cid": 12, "color": "#E15759", "label": "Spring Boot Entry Point", "count": 5}, {
        "cid": 13,
        "color": "#76B7B2",
        "label": "CreateTenantRequest DTO",
        "count": 2
    }, {"cid": 14, "color": "#59A14F", "label": "Maven POM Coordinates", "count": 1}];

    // HTML-escape helper — prevents XSS when injecting graph data into innerHTML
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Build vis datasets
    const nodesDS = new vis.DataSet(RAW_NODES.map((n, i) => ({
        id: n.id, label: n.label, color: n.color, size: n.size,
        font: n.font, title: n.title,
        // Fermat/golden-angle spiral seed positions (#3699): spreading nodes out
        // before physics runs keeps avoidOverlap from computing near-zero-distance
        // repulsion that blows the BarnesHut recursion into a stack overflow on large
        // graphs. `i` is the map index — physics still settles small graphs identically.
        x: 30 * Math.sqrt(i) * Math.cos(i * 2.4),
        y: 30 * Math.sqrt(i) * Math.sin(i * 2.4),
        community: n.community, community_name: n.community_name,
        source_file: n.source_file, file_type: n.file_type, degree: n.degree,
        member_count: n.member_count,
    })));

    const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
        id: i, from: e.from, to: e.to,
        label: '',
        title: e.title,
        dashes: e.dashes,
        width: e.width,
        color: e.color,
        arrows: {to: {enabled: true, scaleFactor: 0.5}},
    })));

    const container = document.getElementById('graph');
    const network = new vis.Network(container, {nodes: nodesDS, edges: edgesDS}, {
        physics: {
            enabled: true,
            solver: 'forceAtlas2Based',
            forceAtlas2Based: {
                gravitationalConstant: -60,
                centralGravity: 0.005,
                springLength: 120,
                springConstant: 0.08,
                damping: 0.4,
                avoidOverlap: 0.8,
            },
            stabilization: {iterations: 200, fit: true},
        },
        interaction: {
            hover: true,
            tooltipDelay: 100,
            hideEdgesOnDrag: true,
            navigationButtons: false,
            keyboard: false,
        },
        nodes: {shape: 'dot', borderWidth: 1.5},
        edges: {smooth: {type: 'continuous', roundness: 0.2}, selectionWidth: 3},
    });

    // Theme toggle (#3894): Light / Dark / System, persisted in localStorage.
    const THEME_KEY = 'graphify-theme';
    const themeMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    let themeLabelColor = '#ffffff';  // matches the per-node font color set in Python
    function themePref() {
        let p = null;
        try {
            p = localStorage.getItem(THEME_KEY);
        } catch (e) {
        }
        return (p === 'light' || p === 'dark' || p === 'system') ? p : null;
    }

    function applyTheme(pref) {
        const t = pref === 'light' ? 'light' : (pref === 'system' && themeMQ && themeMQ.matches) ? 'light' : 'dark';
        const root = document.documentElement;
        if (!root) return;
        root.setAttribute('data-theme', t);
        document.querySelectorAll('[data-theme-choice]').forEach(b => {
            b.setAttribute('aria-pressed', String(b.dataset.themeChoice === (pref || 'dark')));
        });
        const labelColor = getComputedStyle(root).getPropertyValue('--node-label').trim();
        if (labelColor && labelColor !== themeLabelColor) {
            themeLabelColor = labelColor;
            nodesDS.update(nodesDS.get().map(n => ({id: n.id, font: Object.assign({}, n.font, {color: labelColor})})));
        }
    }

    document.querySelectorAll('[data-theme-choice]').forEach(b => {
        b.addEventListener('click', () => {
            const pref = b.dataset.themeChoice;
            try {
                localStorage.setItem(THEME_KEY, pref);
            } catch (e) {
            }
            applyTheme(pref);
        });
    });
    if (themeMQ) {
        const onSchemeChange = () => {
            if (themePref() === 'system') applyTheme('system');
        };
        if (themeMQ.addEventListener) themeMQ.addEventListener('change', onSchemeChange);
        else if (themeMQ.addListener) themeMQ.addListener(onSchemeChange);
    }
    applyTheme(themePref());

    network.once('stabilizationIterationsDone', () => {
        network.setOptions({physics: {enabled: false}});
    });

    function showInfo(nodeId) {
        const n = nodesDS.get(nodeId);
        if (!n) return;
        const neighborIds = network.getConnectedNodes(nodeId);
        const neighborItems = neighborIds.map(nid => {
            const nb = nodesDS.get(nid);
            const color = nb ? nb.color.background : '#555';
            return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(nid)}">${esc(nb ? nb.label : nid)}</span>`;
        }).join('');
        const isMetaNode = !n.file_type && !n.source_file;
        let html = `<div class="field"><b>${esc(n.label)}</b></div>`;
        if (!isMetaNode) {
            html += `<div class="field">Type: ${esc(n.file_type || 'unknown')}</div>`;
        }
        html += `<div class="field">Community: ${esc(n.community_name || '')}</div>`;
        if (!isMetaNode) {
            html += `<div class="field">Source: ${esc(n.source_file || '-')}</div>`;
        } else if (n.member_count !== undefined && n.member_count !== null) {
            html += `<div class="field">Members: ${esc(n.member_count)}</div>`;
        }
        html += `<div class="field">Degree: ${n.degree}</div>`;
        if (neighborIds.length) {
            html += `<div class="field" style="margin-top:8px;color:var(--text-2);font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>`;
        }
        document.getElementById('info-content').innerHTML = html;
    }

    function focusNode(nodeId) {
        network.focus(nodeId, {scale: 1.4, animation: true});
        network.selectNodes([nodeId]);
        showInfo(nodeId);
    }

    // Neighbor links use a data attribute + one delegated listener rather than an
    // inline onclick. A node id/label sourced from a document or a scraped URL
    // (graphify add) can contain a double-quote; dropping the stringified id
    // unescaped into a quoted onclick both broke every link and allowed a hostile
    // source to inject an event handler into the local report (stored XSS, #1838).
    // esc() on data-nid keeps the value inside the attribute; the listener reads it
    // back verbatim. Bound to document so it survives the innerHTML rebuild that
    // recreates #neighbors-list on each showInfo().
    document.addEventListener('click', e => {
        const el = e.target.closest('.neighbor-link');
        if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
    });

    // Sidebar tooltips reuse vis-network's .vis-tooltip style and 100ms tooltipDelay.
    // Names get one only when CSS ellipsis truncates them (the full text is still in
    // the DOM); counts always get one, to say what the number is. Text is set with
    // textContent only (labels are untrusted). Delegated on document so rows rebuilt
    // later (search results, showInfo()) are covered.
    const sidebarTip = document.createElement('div');
    sidebarTip.className = 'vis-tooltip';
    sidebarTip.style.cssText = 'white-space: normal; max-width: 360px; overflow-wrap: break-word;';
    document.body.appendChild(sidebarTip);
    let sidebarTipTimer = null;
    let sidebarTipEl = null;    // element whose text the tooltip shows
    let sidebarTipZone = null;  // element the pointer must leave to hide it
    function hideSidebarTip() {
        clearTimeout(sidebarTipTimer);
        sidebarTip.style.visibility = 'hidden';
        sidebarTip.textContent = '';
        sidebarTipEl = sidebarTipZone = null;
    }

    document.addEventListener('mouseover', e => {
        const zone = e.target.closest && e.target.closest('.legend-count, .legend-item, .search-item, .neighbor-link');
        // Anywhere on a legend row except its count (dot, checkbox, gaps, padding)
        // stands for the row's name, so moving within the row never re-triggers it.
        const el = zone && zone.classList.contains('legend-item') ? zone.querySelector('.legend-label') : zone;
        if (!el || el === sidebarTipEl) return;
        hideSidebarTip();
        const isCount = el.classList.contains('legend-count');
        if (!isCount && el.scrollWidth <= el.clientWidth) return;
        const text = isCount ? `${el.textContent} ${el.textContent === '1' ? 'node' : 'nodes'}` : el.textContent;
        sidebarTipEl = el;
        sidebarTipZone = zone;
        const x = e.clientX, y = e.clientY;
        sidebarTipTimer = setTimeout(() => {
            sidebarTip.textContent = text;
            sidebarTip.style.left = sidebarTip.style.top = '0px';  // measure at full max-width
            sidebarTip.style.visibility = 'visible';
            const w = sidebarTip.offsetWidth, h = sidebarTip.offsetHeight;
            sidebarTip.style.left = Math.max(4, Math.min(x + 12, window.innerWidth - w - 4)) + 'px';
            sidebarTip.style.top = (y + 16 + h > window.innerHeight ? Math.max(4, y - h - 8) : y + 16) + 'px';
        }, 100);
    });
    document.addEventListener('mouseout', e => {
        if (sidebarTipZone && !sidebarTipZone.contains(e.relatedTarget)) hideSidebarTip();
    });
    // A click rebuilds or hides the row (showInfo(), search pick) without a mouseout.
    document.addEventListener('mousedown', hideSidebarTip);

    // Track hovered node — hover detection is more reliable than click params
    let hoveredNodeId = null;
    network.on('hoverNode', params => {
        hoveredNodeId = params.node;
        container.style.cursor = 'pointer';
    });
    network.on('blurNode', () => {
        hoveredNodeId = null;
        container.style.cursor = 'default';
    });
    container.addEventListener('click', () => {
        if (hoveredNodeId !== null) {
            showInfo(hoveredNodeId);
            network.selectNodes([hoveredNodeId]);
        }
    });
    network.on('click', params => {
        if (params.nodes.length > 0) {
            showInfo(params.nodes[0]);
        } else if (hoveredNodeId === null) {
            document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
        }
    });

    const searchInput = document.getElementById('search');
    const searchResults = document.getElementById('search-results');
    searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase().trim();
        searchResults.innerHTML = '';
        if (!q) {
            searchResults.style.display = 'none';
            return;
        }
        const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
        if (!matches.length) {
            searchResults.style.display = 'none';
            return;
        }
        searchResults.style.display = 'block';
        matches.forEach(n => {
            const el = document.createElement('div');
            el.className = 'search-item';
            el.textContent = n.label;
            el.style.borderLeft = `3px solid ${n.color.background}`;
            el.style.paddingLeft = '8px';
            el.onclick = () => {
                network.focus(n.id, {scale: 1.5, animation: true});
                network.selectNodes([n.id]);
                showInfo(n.id);
                searchResults.style.display = 'none';
                searchInput.value = '';
            };
            searchResults.appendChild(el);
        });
    });
    document.addEventListener('click', e => {
        if (!searchResults.contains(e.target) && e.target !== searchInput)
            searchResults.style.display = 'none';
    });

    const hiddenCommunities = new Set();

    const selectAllCb = document.getElementById('select-all-cb');

    function updateSelectAllState() {
        const total = LEGEND.length;
        const hidden = hiddenCommunities.size;
        selectAllCb.checked = hidden === 0;
        selectAllCb.indeterminate = hidden > 0 && hidden < total;
    }

    function toggleAllCommunities(hide) {
        document.querySelectorAll('.legend-item').forEach(item => {
            hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
        });
        document.querySelectorAll('.legend-cb').forEach(cb => {
            cb.checked = !hide;
        });
        LEGEND.forEach(c => {
            if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
        });
        const updates = RAW_NODES.map(n => ({id: n.id, hidden: hide}));
        nodesDS.update(updates);
        updateSelectAllState();
    }

    const legendEl = document.getElementById('legend');
    LEGEND.forEach(c => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'legend-cb';
        cb.checked = true;
        cb.addEventListener('change', (e) => {
            e.stopPropagation();
            if (cb.checked) {
                hiddenCommunities.delete(c.cid);
                item.classList.remove('dimmed');
            } else {
                hiddenCommunities.add(c.cid);
                item.classList.add('dimmed');
            }
            const updates = RAW_NODES
                .filter(n => n.community === c.cid)
                .map(n => ({id: n.id, hidden: !cb.checked}));
            nodesDS.update(updates);
            updateSelectAllState();
        });
        item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
        item.prepend(cb);
        item.onclick = (e) => {
            if (e.target === cb) return;
            cb.checked = !cb.checked;
            cb.dispatchEvent(new Event('change'));
        };
        legendEl.appendChild(item);
    });
</script>
<script>
    // Render hyperedges as shaded regions
    const hyperedges = [{
        "id": "readme_antipattern_profile_code_path",
        "label": "Antipattern-profile code path (ThreadLocal-based tenant propagation)",
        "nodes": ["readme_tenantidentifierfilter_antipattern", "readme_userserviceimpl_antipattern", "readme_tenantcontextholder", "readme_antipattern_annotation"],
        "relation": "participate_in",
        "confidence": "EXTRACTED",
        "confidence_score": 1.0,
        "source_file": "README.md"
    }, {
        "id": "readme_recommended_profile_code_path",
        "label": "Recommended-profile code path (Reactor Context tenant propagation)",
        "nodes": ["readme_tenantidentifierfilter_recommended", "readme_userserviceimpl_recommended", "readme_tenantcontext", "readme_reactor_context", "readme_recommended_annotation"],
        "relation": "participate_in",
        "confidence": "EXTRACTED",
        "confidence_score": 1.0,
        "source_file": "README.md"
    }, {
        "id": "readme_three_antipatterns_and_shared_fix",
        "label": "Three tenant-context antipatterns and their shared Reactor Context / lazy-resolution fix",
        "nodes": ["readme_threadlocal_antipattern", "readme_stale_pooled_thread_context_antipattern", "readme_eager_evaluation_antipattern", "readme_reactor_context", "readme_lazy_resolution_defer"],
        "relation": "form",
        "confidence": "EXTRACTED",
        "confidence_score": 1.0,
        "source_file": "README.md"
    }];
    // afterDrawing passes ctx already transformed to network coordinate space.
    // Draw node positions raw — no manual pan/zoom/DPR math needed.

    // Andrew's monotone chain. Returns the hull in counter-clockwise order, which
    // is what the perimeter must be traced in. Collinear and duplicate points
    // collapse to the extremes, so degenerate member sets render as a segment
    // rather than a zero-area crossed path.
    function convexHull(pts) {
        const p = pts.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
        if (p.length < 3) return p;
        const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
        const build = seq => {
            const out = [];
            for (const q of seq) {
                while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], q) <= 0) out.pop();
                out.push(q);
            }
            out.pop();
            return out;
        };
        const hull = build(p).concat(build(p.slice().reverse()));
        return hull.length >= 3 ? hull : p;
    }

    network.on('afterDrawing', function (ctx) {
        hyperedges.forEach(h => {
            const positions = h.nodes
                .map(nid => network.getPositions([nid])[nid])
                .filter(p => p !== undefined);
            if (positions.length < 2) return;
            ctx.save();
            ctx.globalAlpha = 0.12;
            ctx.fillStyle = '#6366f1';
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 2;
            ctx.beginPath();
            // Centroid and expanded hull in network coordinates.
            // The perimeter must follow hull order, not h.nodes order: tracing the
            // raw member order self-intersects whenever the layout does not happen
            // to place members in angular order, filling as crossed wedges.
            const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
            const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
            const hull = convexHull(positions);
            const expanded = hull.map(p => ({
                x: cx + (p.x - cx) * 1.15,
                y: cy + (p.y - cy) * 1.15
            }));
            ctx.moveTo(expanded[0].x, expanded[0].y);
            expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 0.4;
            ctx.stroke();
            // Label
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#4f46e5';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(h.label, cx, cy - 5);
            ctx.restore();
        });
    });
</script>
